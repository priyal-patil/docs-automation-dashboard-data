name: Sync data to dashboard repo

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          path: data-repo

      - name: Checkout dashboard repo
        uses: actions/checkout@v4
        with:
          repository: priyal-patil/docs-automation-dashboard
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard-repo

      - name: Copy latest data into dashboard repo
        run: |
          rm -rf dashboard-repo/data
          cp -R data-repo/data dashboard-repo/data

      - name: Commit and push if changed
        working-directory: dashboard-repo
        run: |
          git config user.name "docs-automation-dashboard-data sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to sync."
            exit 0
          fi
          git commit -m "Sync data from docs-automation-dashboard-data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # A commit landing in the dashboard repo between checkout and push
          # (a UI change, or a concurrent sync) used to fail the whole sync and
          # leave the dashboard serving stale data until the next run. Rebase
          # onto whatever arrived and try again — data/ is wholly owned by this
          # workflow, so a rebase can't conflict with anyone else's edits.
          for i in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $(( i * 3 ))
          done

          echo "::error::Could not push synced data after 5 attempts"
          exit 1
